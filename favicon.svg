<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Top cap of spool -->
  <ellipse cx="50" cy="28" rx="46" ry="13" fill="#8B4513"/>
  <ellipse cx="50" cy="28" rx="46" ry="13" fill="none" stroke="#6B2F0A" stroke-width="1.5"/>
  <!-- Center hole top -->
  <ellipse cx="50" cy="28" rx="11" ry="5" fill="#5A1F08"/>

  <!-- Spool body -->
  <rect x="14" y="28" width="72" height="44" fill="#A0522D"/>

  <!-- Thread wrapped around middle -->
  <rect x="16" y="32" width="68" height="36" fill="#D4A853"/>
  <line x1="16" y1="39" x2="84" y2="39" stroke="#B8860B" stroke-width="2.5" opacity="0.55"/>
  <line x1="16" y1="47" x2="84" y2="47" stroke="#C8960B" stroke-width="2.5" opacity="0.55"/>
  <line x1="16" y1="55" x2="84" y2="55" stroke="#B8860B" stroke-width="2.5" opacity="0.55"/>
  <line x1="16" y1="63" x2="84" y2="63" stroke="#C8960B" stroke-width="2.5" opacity="0.55"/>

  <!-- Bottom cap of spool -->
  <ellipse cx="50" cy="72" rx="46" ry="13" fill="#8B4513"/>
  <ellipse cx="50" cy="72" rx="46" ry="13" fill="none" stroke="#6B2F0A" stroke-width="1.5"/>
  <!-- Center hole bottom -->
  <ellipse cx="50" cy="72" rx="11" ry="5" fill="#5A1F08"/>

  <!-- Thread tail flowing off spool -->
  <path d="M84,50 Q96,38 92,22" stroke="#D4A853" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
